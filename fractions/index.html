<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7ecff"><title>Fraction Quest · Sashtika's Class 4 Maths Chapter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/alien_teach.webp" as="image">
<style>@font-face{font-family:"NunitoE";src:url(assets/nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{--ink:#27324a;--sun:#ffd23f;--leaf:#2fb872;--leaf2:#1f8f57;--berry:#ff6a8d;--ocean:#2e86ff;--grape:#7d4fe8;--orange:#ff9b3d;--mint:#7fdcc1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;font-family:"NunitoE","Nunito","Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#e7ecff 0,#f3fbff 45%,#fff4e6 100%);background-attachment:fixed;color:var(--ink);font-size:19px;line-height:1.4;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
img{max-width:100%;height:auto}
h1,h2,h3{margin:.15em 0;line-height:1.15}
.wrap{max-width:820px;margin:0 auto;padding:10px 12px 60px}
.muted{color:#5d6a85;font-size:16px}
.center{text-align:center}
/* top bar */
#bar{position:sticky;top:0;z-index:30;background:#ffffffee;backdrop-filter:blur(6px);border-radius:0 0 22px 22px;padding:6px 10px;box-shadow:0 4px 14px #0002}
#bar .in{display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto}
#home{border:0;background:#e4f4ff;border-radius:16px;min-height:48px;padding:4px 12px;font-weight:900;font-size:18px}
#bar .t{flex:1;min-width:0;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff6d6;border:2px solid #ffe08a;border-radius:16px;padding:2px 10px;font-weight:900;font-size:18px;white-space:nowrap;min-height:40px;display:flex;align-items:center;gap:4px}
.pill.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
#voice{border:2px solid #cfe0f5;background:#fff;border-radius:16px;min-height:40px;min-width:48px;font-size:20px}
#voice[aria-pressed=false]{opacity:.55}
/* cards, buttons */
.card{background:#fff;border-radius:26px;padding:14px 16px;margin:12px 0;box-shadow:0 5px 18px #2a4a7a1f}
.btn{border:0;border-radius:22px;padding:12px 22px;min-height:58px;font-weight:900;font-size:22px;background:var(--ocean);color:#fff;box-shadow:0 5px 0 #1b5fb5;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b5fb5}
.btn.g{background:var(--leaf);box-shadow:0 5px 0 var(--leaf2)}
.btn.o{background:var(--orange);box-shadow:0 5px 0 #c96b12}
.btn.soft{background:#eef4fb;color:var(--ink);box-shadow:0 5px 0 #c9d6e6}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
/* mascot + speech bubble */
.guide{display:flex;align-items:center;gap:6px;margin:6px 0}
.guide img{width:42%;max-width:190px;flex:none;filter:drop-shadow(0 6px 6px #0002)}
.bub{position:relative;background:#fff;border:3px solid #bfe3d6;border-radius:22px;padding:10px 14px;font-weight:800;font-size:21px;flex:1;min-width:0}
.bub:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #bfe3d6;border-left:0}
.bub.oops{border-color:#ffc58f;background:#fff8ef}.bub.oops:before{border-right-color:#ffc58f}
.bub.hint{border-color:#c8b6ff;background:#f7f3ff}.bub.hint:before{border-right-color:#c8b6ff}
.bub.good{border-color:#9be3b8;background:#f0fff5}.bub.good:before{border-right-color:#9be3b8}
.guide.small img{width:30%;max-width:130px}
.guide.small .bub{font-size:19px}
.jump img{animation:jump .7s ease}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
/* map */
.hero h1{font-size:30px;text-align:center}
.hero .sub{text-align:center;font-weight:800;color:#5d6a85}
.map{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.map{grid-template-columns:1fr 1fr}}
.stc{display:flex;align-items:center;gap:12px;border:0;text-align:left;background:#fff;border-radius:24px;padding:12px 14px;box-shadow:0 5px 0 var(--c,#ccd),0 8px 18px #0001;min-height:96px;width:100%}
.stc .ic{font-size:44px;width:70px;height:70px;border-radius:50%;background:var(--bg,#fff3d6);display:flex;align-items:center;justify-content:center;flex:none}
.stc .nm{font-weight:900;font-size:21px}
.stc .st{font-size:22px;letter-spacing:2px}
.stc.lock{opacity:.55;filter:grayscale(.6)}
.stc.next{animation:glowp 1.6s infinite}
@keyframes glowp{0%,100%{box-shadow:0 5px 0 var(--c),0 0 0 0 #ffd23f}50%{box-shadow:0 5px 0 var(--c),0 0 0 8px #ffd23f88}}
.stickers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stk{width:76px;height:76px;border-radius:50%;border:3px dashed #ccd6e6;display:flex;align-items:center;justify-content:center;font-size:40px;background:#f6f8fc}
.stk.got{border:3px solid #ffd23f;background:radial-gradient(#fffbe6,#ffe9a8);animation:pop .6s}
.stk small{display:none}
.giftcard{text-align:center}
.giftbtn{font-size:84px;border:0;background:none;line-height:1}
.giftbtn.wig{animation:wig 1.2s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(10deg)}30%{transform:rotate(-6deg)}40%{transform:rotate(0)}}
/* station */
.steps{display:flex;gap:6px;justify-content:center;margin:4px 0 2px}
.steps span{flex:1;max-width:150px;text-align:center;border-radius:14px;padding:4px 6px;background:#eef2f8;font-weight:800;font-size:15px}
.steps span.on{background:#ffe08a}.steps span.ok{background:#c8f2d8}
.sth{display:flex;align-items:center;gap:10px}
.sth .ic{font-size:40px}
.sth h2{font-size:26px}
.lesson .line{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;background:#f7f9ff!important;padding:8px 10px;border-radius:16px;margin:4px 0;border:0;background:none;width:100%;text-align:left}
.lesson .line .e{font-size:32px;flex:none;width:52px;text-align:center}
.lesson .line.rd{background:#fff3c4!important}
.actt{font-size:23px;font-weight:900;text-align:center;margin:6px 0}
.tip{text-align:center;color:#5d6a85;font-size:16px;margin-top:8px}
/* draggable items + zones */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px;min-height:20px}
.di{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item{border:3px solid #d5e2f2;background:#fff;border-radius:20px;padding:6px 10px;min-width:96px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 4px 0 #d5e2f2;transition:transform .15s}
.item .oi{font-size:42px;line-height:1.1}
.item.sel{border-color:#ffb703;box-shadow:0 0 0 5px #ffd23f88;transform:scale(1.06)}
.item.drag{opacity:.35}
.item.placed{display:none}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg);opacity:.95}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.bins.five{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.bin{border:4px dashed #b9cbe3;border-radius:22px;background:#f7fbff;min-height:140px;padding:8px;text-align:center;transition:background .15s,transform .15s}
.bin .bi{font-size:40px;line-height:1.1}
.bin h4{margin:2px 0;font-size:20px}
.bin .tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:30px;min-height:36px}
.over,.dz.over{background:#fff3c4!important;transform:scale(1.04);border-color:#ffb703!important}
.glow{animation:glw 1s 3}
@keyframes glw{0%,100%{box-shadow:0 0 0 0 #ffd23f}50%{box-shadow:0 0 0 9px #ffd23faa}}
.no{animation:shake .45s}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.mt .col{display:flex;flex-direction:column;gap:10px}
.mt .item{flex-direction:row;gap:8px;min-height:74px;font-size:20px;justify-content:flex-start;width:100%}
.mt .item .oi{font-size:38px}
.mz{border:4px dashed #b9cbe3;border-radius:20px;background:#f7fbff;min-height:74px;display:flex;align-items:center;gap:8px;padding:4px 10px;font-weight:900;font-size:20px}
.mz .oi{font-size:34px}
.mz .got{margin-left:auto;font-size:34px}
.mz.ok,.item.ok{border-style:solid;border-color:#5fd08f;background:#eafff1}
/* face puzzle */
.facewrap{position:relative;width:min(88vw,330px);aspect-ratio:1;margin:0 auto}
.facewrap svg{width:100%;height:100%;display:block}
.fz{position:absolute;transform:translate(-50%,-50%);border:4px dashed #8aa3c4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:#ffffff55}
.fz.ok{border-color:transparent;background:none}
.fz.earL .pe{transform:scaleX(-1);display:inline-block}
/* torch room */
.room{position:relative;width:100%;max-width:560px;aspect-ratio:4/3;margin:0 auto;border-radius:22px;overflow:hidden;background:linear-gradient(#f9e6c8 0 64%,#c99a6b 64%);touch-action:none;user-select:none;-webkit-user-select:none}
.room .win{position:absolute;left:8%;top:8%;width:22%;height:26%;background:#24345e;border:6px solid #fff;border-radius:6px}
.room .shelf{position:absolute;right:6%;top:30%;width:34%;height:5px;background:#8a5a33;border-radius:3px}
.room .rug{position:absolute;left:28%;top:74%;width:44%;height:16%;background:#e86a8d;border-radius:50%;opacity:.7}
.ob{position:absolute;transform:translate(-50%,-50%);border:0;background:none;font-size:clamp(34px,9vw,52px);line-height:1;padding:6px;border-radius:50%;touch-action:none}
.ob.found{background:#fff8;box-shadow:0 0 0 4px #5fd08f}
.dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent 62px,rgba(4,8,30,.96) 100px);transition:opacity 1s}
.dark.off{opacity:0}
.torchq{text-align:center;font-weight:900;font-size:23px;margin:8px 0}
/* sounds */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sbtn{position:relative;border:3px solid #d5e2f2;background:#fff;border-radius:22px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 4px 0 #d5e2f2;overflow:visible}
.sbtn .oi{font-size:46px}
.sbtn.heard{border-color:#5fd08f;background:#eafff1}
.sbtn.heard:after{content:"✔";position:absolute;top:4px;right:8px;color:#1f8f57;font-weight:900}
.sbtn.play .oi{animation:wob .5s 2}
@keyframes wob{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.15)}75%{transform:rotate(12deg) scale(1.15)}}
.ring{position:absolute;left:50%;top:40%;width:60px;height:60px;margin:-30px;border:4px solid #2e86ff;border-radius:50%;animation:ring 1s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.meter{height:16px;background:#e3ebf4;border-radius:10px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .4s}
/* reaction face (taste/smell) */
.react{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px;min-height:84px}
.react .fe{font-size:64px;line-height:1;transition:transform .3s}
.react .fe.bump{animation:pop .6s}
/* riddle */
.bag{font-size:92px;border:0;background:none;line-height:1;display:block;margin:0 auto}
.bag.feel{animation:wig .9s 1}
.clue{text-align:center;font-size:25px;font-weight:900;min-height:40px;margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:460px;margin:8px auto 0}
.opt{border:3px solid #d5e2f2;background:#fff;border-radius:20px;min-height:100px;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #d5e2f2}
.opt .oi{font-size:46px}
.opt.right{border-color:#5fd08f;background:#eafff1}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:#1b2440aa;display:flex;align-items:center;justify-content:center;padding:14px}
.ov .box{background:#fff;border-radius:28px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px;text-align:center;animation:popin .4s}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ov .box img.mas{width:62%;max-width:260px}
.bigstk{font-size:90px;animation:spin 1s}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}to{transform:rotate(0) scale(1)}}
/* flying star */
.fly{position:fixed;z-index:80;font-size:44px;pointer-events:none;transition:transform .9s cubic-bezier(.5,-.3,.7,1),opacity .9s}
#cf{position:fixed;inset:0;pointer-events:none;z-index:90}
/* badge + certificate */
.badge{width:230px;height:230px;margin:6px auto;border-radius:50%;background:radial-gradient(circle,#fff7cf 0 55%,#ffd23f 56% 64%,#ff9b3d 65% 72%,#7d4fe8 73%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 22px #0003;animation:spin 1.1s}
.badge .t{font-weight:1000;font-size:21px;line-height:1.05;color:#4a2a9a}
.badge .e{font-size:28px;letter-spacing:2px}
.cert{border:8px double #ffb703;border-radius:26px;background:linear-gradient(#fffdf3,#fff4d6);text-align:center;padding:16px}
.cert .nm{font-size:44px;font-weight:1000;color:#7d4fe8;margin:4px 0}
.cert img{width:55%;max-width:240px}
.foot{text-align:center;margin-top:24px}
.foot button{border:0;background:none;color:#7a86a0;text-decoration:underline;font-size:15px;min-height:40px}
@media(min-width:700px){body{font-size:20px}.lesson .line{font-size:23px}.guide img{max-width:210px}}
@media print{#bar,.foot,.row,.noprint{display:none!important}body{background:#fff}.cert{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:900;margin:0 2px}
.fr b{display:block;padding:0 3px 2px;border-bottom:2.5px solid currentColor}
.fr i{display:block;font-style:normal;padding:2px 3px 0}
.big .fr,.big.fr{font-size:1.35em}
.lesson .line{border:2px solid #e3e9f6!important;margin:6px 0!important}
.say{border:2px solid #cfe0f5;background:#fff;border-radius:14px;min-height:40px;min-width:44px;font-size:18px;vertical-align:middle}
.task{text-align:center;font-weight:900;font-size:22px;margin:8px 0}
.artbox{max-width:300px;margin:6px auto}
.artbox.wide{max-width:520px}
.art{width:100%;height:auto;display:block}
.art .pc{cursor:pointer;transition:fill .15s}
.cutbar{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.rb{width:58px;height:58px;border-radius:50%;border:0;background:var(--grape);color:#fff;font-size:32px;font-weight:900;box-shadow:0 4px 0 #4f2ca8}
.cutn{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:15px;min-width:110px}
.cutn b{font-size:34px;line-height:1.1}
.btn.sm{min-height:48px;font-size:18px;padding:8px 16px}
.shp{width:64px;height:64px;display:block}
.item .oi .shp{width:64px;height:64px}
.mini .shp{width:30px;height:30px;display:inline-block}
.qn{font-size:21px;font-weight:800;text-align:center;margin:6px 0}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin i{display:block;width:70px;height:4px;background:var(--ink);border-radius:2px}
.fin input,.ni,.mi{width:70px;height:56px;font:inherit;font-size:28px;font-weight:900;text-align:center;border:3px solid #b9cbe3;border-radius:14px;background:#fff;color:var(--ink)}
.ni{width:96px}
.mi{width:58px;height:48px;font-size:24px}
.fin input:focus,.ni:focus,.mi:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 4px #2e86ff33}
.unit{font-weight:800}
.eqn{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px}
.fr.big2 b,.fr.big2 i{padding:4px 6px;min-width:44px;text-align:center}
.eq{font-weight:900;font-size:34px}
.livebars{max-width:420px;margin:8px auto 0;display:flex;flex-direction:column;gap:6px;width:100%}
.ghostbar{height:44px;border:3px dashed #b9cbe3;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8a99b5;font-weight:900}
.opts{display:grid;grid-template-columns:1fr;gap:10px;max-width:420px;margin:0 auto;width:100%}
.opt{border:3px solid #d5e2f2;background:#fff;border-radius:18px;min-height:58px;font-weight:800;font-size:20px;box-shadow:0 4px 0 #d5e2f2}
.opt.right{border-color:#5fd08f;background:#eafff1}
/* share */
.laddus{gap:8px}
.ld,.lp{width:40px;height:40px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffe08a,#f2a516 60%,#c97b06);box-shadow:inset -3px -4px 0 #b86d00,0 2px 0 #0002;padding:0}
.ld.sel{box-shadow:0 0 0 5px #7d4fe8aa}
.ld.drag{opacity:.3}
.lp{width:30px;height:30px;display:inline-block}
.back{border:2px solid #d9e2ef;background:#fff;border-radius:12px;font-size:14px;font-weight:800;min-height:36px;padding:2px 10px;margin-top:4px}
.plates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:620px){.plates{grid-template-columns:repeat(4,1fr)}}
.plate{border:4px solid #d9e2ef;border-radius:50%/40%;background:radial-gradient(#fff,#eef3fa);min-height:130px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s}
.plate .tray{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:30px}
.pn{font-size:15px;font-weight:800;margin-top:4px}
/* colour set */
.setg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:8px auto}
.si{font-size:34px;min-height:62px;border:3px solid #e1e8f3;border-radius:16px;background:#fff;filter:grayscale(1);opacity:.55;transition:all .15s}
.si.on{filter:none;opacity:1;border-color:#7d4fe8;background:#f3eeff;transform:scale(1.06)}
.si[data-g="0"]{box-shadow:0 0 0 3px #ffb703}.si[data-g="1"]{box-shadow:0 0 0 3px #2e86ff}
/* wall */
.wall{display:flex;flex-direction:column;gap:5px}
.wrow{display:flex;gap:6px;align-items:stretch}
.wl{flex:none;width:68px;min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.wl.dz{border:3px dashed #8aa3c4;background:#f5f8fd;font-size:20px;color:#8aa3c4}
.wl.ok{background:#e9f6ff;border:3px solid #2e86ff;color:var(--ink)}
.wt{flex:1;display:flex;min-width:0}
.tile{flex:1;min-width:0;border:2px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;min-height:46px;cursor:pointer;color:#fff}
.wrow:nth-child(1) .tile{background:#24406e}.wrow:nth-child(2) .tile{background:#ef6b4a}.wrow:nth-child(3) .tile{background:#ff9b3d}.wrow:nth-child(4) .tile{background:#e3b505}.wrow:nth-child(5) .tile{background:#2fb872}.wrow:nth-child(6) .tile{background:#2e86ff}.wrow:nth-child(7) .tile{background:#7d4fe8}

 bird(a,t){[0,.18,.36,.7,.88].forEach(o=>{const s=a.createOscillator(),g=a.createGain();s.frequency.setValueAtTime(2200,t+o);s.frequency.exponentialRampToValueAtTime(3600,t+o+.1);g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.12,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.12);s.connect(g);g.connect(a.destination);s.start(t+o);s.stop(t+o+.13)})},
 clock(a,t){[0,.4,.8,1.2].forEach((o,i)=>{const s=a.createOscillator(),g=a.createGain();s.type='square';s.frequency.value=i%2?1100:1500;g.gain.setValueAtTime(.05,t+o);g.gain.exponentialRampToValueAtTime(.0005,t+o+.03);s.connect(g);g.connect(a.destination);s.start(t+o);s.stop(t+o+.04)})},

};

/* ---------- confetti ---------- */
const CF={p:[],run:false};
function confetti(n){n=n||90;if(!CF.c){CF.c=document.createElement('canvas');CF.c.id='cf';document.body.appendChild(CF.c);CF.x=CF.c.getContext('2d')}
 const W=CF.c.width=innerWidth,H=CF.c.height=innerHeight,cols=['#ff6a8d','#ffd23f','#2fb872','#2e86ff','#7d4fe8','#ff9b3d'];
 for(let i=0;i<n;i++)CF.p.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-3,r:Math.random()*7+5,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4,l:0});
 if(!CF.run){CF.run=true;(function loop(){const x=CF.x;x.clearRect(0,0,CF.c.width,CF.c.height);CF.p=CF.p.filter(p=>p.y<H+20&&p.l<180);CF.p.forEach(p=>{p.l++;p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-p.l/180);x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6);x.restore()});if(CF.p.length)requestAnimationFrame(loop);else{CF.run=false;x.clearRect(0,0,CF.c.width,CF.c.height)}})()}}
function flyStar(from){const r=from?from.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};const t=$('#pStars').getBoundingClientRect();const f=document.createElement('div');f.className='fly';f.textContent='⭐';f.style.left=(r.left+r.width/2-22)+'px';f.style.top=(r.top+r.height/2-22)+'px';document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${t.left-r.left-r.width/2+10}px,${t.top-r.top-r.height/2+4}px) scale(.6)`;f.style.opacity='.3'}));setTimeout(()=>{f.remove();hud(true)},950)}

/* ---------- drag & drop / tap-to-place (pointer events: mouse, touch, pen) ---------- */
function DnD(root,o){
 let sel=null,drag=null,raf=0;
 const zones=()=>$$(o.zone,root);
 const clearSel=()=>{if(sel){sel.classList.remove('sel');sel=null}};
 function zoneAt(x,y){for(const el of document.elementsFromPoint(x,y)){const z=el.closest&&el.closest(o.zone);if(z&&root.contains(z))return z}return null}
 function edge(){if(!drag||!drag.on)return;const y=drag.y;let dy=0;if(y<110)dy=-(110-y)/6;else if(y>innerHeight-70)dy=(y-innerHeight+70)/6;if(dy){window.scrollBy(0,dy);const z=zoneAt(drag.x,drag.y);zones().forEach(q=>q.classList.toggle('over',q===z))}raf=requestAnimationFrame(edge)}
 let zd=null;root.addEventListener('pointerdown',e=>{const it=e.target.closest(o.item);if(!it){const z=e.target.closest(o.zone);zd=(z&&root.contains(z))?{z,x:e.clientX,y:e.clientY,id:e.pointerId}:null}if(!it||!root.contains(it)||it.dataset.locked)return;if(e.pointerType==='mouse'&&e.button!==0)return;
  drag={it,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,on:false,id:e.pointerId};try{it.setPointerCapture(e.pointerId)}catch(_){}});
 root.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.on&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){drag.on=true;clearSel();const g=drag.it.cloneNode(true);g.classList.add('ghost');g.removeAttribute('id');g.style.width=drag.it.offsetWidth+'px';document.body.appendChild(g);drag.g=g;drag.it.classList.add('drag');raf=requestAnimationFrame(edge)}
  if(drag.on){e.preventDefault();drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';const z=zoneAt(e.clientX,e.clientY);zones().forEach(q=>q.classList.toggle('over',q===z))}});
 const end=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;cancelAnimationFrame(raf);try{d.it.releasePointerCapture(d.id)}catch(_){}
  zones().forEach(q=>q.classList.remove('over'));
  if(d.on){d.g.remove();d.it.classList.remove('drag');if(e.type==='pointerup'){const z=zoneAt(e.clientX,e.clientY);if(z)o.onDrop(d.it,z)}d.it.dataset.dragged='1';setTimeout(()=>delete d.it.dataset.dragged,80)}
  else if(e.type==='pointerup'){toggle(d.it)}};
 function toggle(it){if(sel===it){clearSel()}else{clearSel();sel=it;it.classList.add('sel');snd.pop();o.onSelect&&o.onSelect(it)}}
 root.addEventListener('pointerup',e=>{if(zd&&e.pointerId===zd.id){const q=zd;zd=null;if(Math.hypot(e.clientX-q.x,e.clientY-q.y)<12&&sel&&!(o.skip&&o.skip(e))){const s2=sel;clearSel();o.onDrop(s2,q.z);root.dataset.zt=Date.now()}else if(Math.hypot(e.clientX-q.x,e.clientY-q.y)<12&&o.onZoneTap&&!sel){o.onZoneTap(q.z,e);root.dataset.zt=Date.now()}return}end(e)});root.addEventListener('pointercancel',end);
 root.addEventListener('click',e=>{const it=e.target.closest(o.item);if(it&&root.contains(it)&&e.detail===0&&!it.dataset.locked){toggle(it);return}
  const z=e.target.closest(o.zone);if(!z||!root.contains(z)||(it&&z===it))return;if(Date.now()-(+root.dataset.zt||0)<700)return;if(!sel){if(e.detail===0&&o.onZoneTap)o.onZoneTap(z,e);return}const s=sel;clearSel();o.onDrop(s,z)});
 return {clear:clearSel};
}

/* cutter: slice a pizza / bar into n equal parts and shade k */
T.cutter=function(body,A,c){

 const task=()=>{const x=R();$('#task',body).innerHTML=`Round ${r+1} of ${A.rounds.length}: show <span class="big">${F(x.k,x.n)}</span>`;n=1;sh=new Set();draw();say(`Show ${x.k}/${x.n}`)};

/* quiz: typed fraction / typed number / missing number / small MCQ */
T.quiz=function(body,A,c){
 let r=0;
 const live=()=>{const x=A.rounds[r];if(x.kind!=='miss')return;const v=num($('#mv',body).value);
  const side=s=>s.map(q=>q===null?v:q);const bar=([a,b])=>(b&&b<=24&&a!==null&&a<=b)?barSVG(b,set([...Array(a).keys()]),{h:40}):(b&&b<=24?barSVG(b,set(),{h:40}):`<div class="ghostbar">?</div>`);
  $('#lb',body).innerHTML=bar(side(x.a))+bar(side(x.b))};
 const show=()=>{const x=A.rounds[r];let inp='';
  if(x.kind==='frac')inp=finHTML();
  else if(x.kind==='int')inp=`<input class="ni" id="ni" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="answer"> <span class="unit">${x.unit||''}</span>`;
  else if(x.kind==='mcq')inp=`<div class="opts">${x.opts.map(o=>`<button class="opt" type="button" data-o="${o}">${o}</button>`).join('')}</div>`;
  else if(x.kind==='miss'){const cell=q=>q===null?`<input class="mi" id="mv" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="missing number">`:q;
   const fr=([a,b])=>`<span class="fr big2"><b>${cell(a)}</b><i>${cell(b)}</i></span>`;inp=`<div class="eqn">${fr(x.a)}<span class="eq">=</span>${fr(x.b)}</div><div class="livebars" id="lb"></div>`}
  body.innerHTML=`<div class="qn">${A.rounds.length>1?`<span class="muted">Question ${r+1} of ${A.rounds.length}</span><br>`:''}${x.q?fx(x.q)+` <button class="say" type="button" data-say="${clean(fx(x.q))}" aria-label="Read aloud">🔊</button>`:'Find the missing number.'}</div>${x.art?`<div class="artbox">${x.art()}</div>`:''}<div class="ans">${inp}</div>${x.kind!=='mcq'?'<div class="row"><button class="btn g" type="button" id="chk">Check ✔</button></div>':''}`;
  if(x.kind==='miss'){live();$('#mv',body).addEventListener('input',live)}
  const f=$('input',body);if(f&&matchMedia('(pointer:fine)').matches)f.focus({preventScroll:true});
  if(x.q)say(fx(x.q));
 };
 const next=msg=>{r++;if(r<A.rounds.length){c.good(msg);setTimeout(show,1400)}else{c.finish(A.win)}};

  if(x.kind==='frac'){const a=num($('.fn',body).value),b=num($('.fd',body).value);

/* share: deal laddus onto plates, then answer */
T.share=function(body,A,c){

 const counts=()=>$$('.plate',body).map(p=>$$('.lp',p).length);
 const upd=()=>{$$('.plate',body).forEach(p=>$('.pn b',p).textContent=$$('.lp',p).length);if(phase===0&&!$$('#pile .ld',body).length)judge()};
 const put=(it,z)=>{it.remove();$('.tray',z).insertAdjacentHTML('beforeend','<span class="lp"></span>');snd.pop();upd()};
 DnD(body,{item:'#pile .ld',zone:'.plate',skip:e=>!!e.target.closest('.back'),onDrop:(it,z)=>{if(phase)return;put(it,z)},onZoneTap:(z,e)=>{if(phase||e.target.closest('.back'))return;const it=$('#pile .ld',body);if(it)put(it,z)}});
 body.addEventListener('click',e=>{if(phase)return;const bk=e.target.closest('.back');if(bk){const lp=$$('.lp',bk.closest('.plate')).pop();if(!lp)return;lp.remove();$('#pile',body).insertAdjacentHTML('beforeend','<button class="ld di" type="button" aria-label="laddu"></button>');upd();return}
});
 function judge(){const k=counts();if(k.every(x=>x===k[0])){phase=1;c.good(`✅ Fair share! Each friend got ${k[0]} laddus. ${A.total} shared into ${A.plates} equal groups.`);setTimeout(ask,1200)}
  else c.miss(`The plates have ${k.join(', ')}. That is not fair! Take some back and share equally.`)}
 function ask(){const q=A.qs[qi];$('#qbox',body).innerHTML=`<div class="qn">${fx(q.q)}</div><div class="ans"><input class="ni" id="ni" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="answer"> <span class="unit">laddus</span></div><div class="row"><button class="btn g" type="button" id="chk">Check ✔</button></div>`;say(fx(q.q));$('#qbox',body).scrollIntoView({block:'nearest'})}
 const chk=()=>{if(c.done||phase!==1)return;const q=A.qs[qi],v=num($('#ni',body).value);if(v===null){c.miss('Type a number first.');return}
  if(v===q.ans){qi++;if(qi<A.qs.length){c.good(`✅ Yes! ${q.q.replace('How many laddus is ','').replace('?','')} = ${q.ans}.`);setTimeout(ask,1200)}else c.finish(A.win)}else{bump($('#ni',body));c.miss(`Not ${v}. ${q.hint}`)}};
 body.addEventListener('click',e=>{if(e.target.closest('#chk'))chk()});enterKey(body,chk);
};

/* colorset: colour num/den of a group */
T.colorset=function(body,A,c){
 let r=0;
 const show=()=>{const x=A.rounds[r];body.innerHTML=`<div class="task">Colour <span class="big">${F(x.num,x.den)}</span> of the ${x.n} ${x.name}</div><div class="setg">${[...Array(x.n).keys()].map(i=>`<button class="si" type="button" data-i="${i}" aria-pressed="false">${x.e}</button>`).join('')}</div><div class="muted center" id="cc">Coloured: 0</div><div class="row"><button class="btn g" type="button" id="chk">Check ✔</button></div>`;say(`Colour ${x.num}/${x.den} of the ${x.n} ${x.name}`)};
 body.addEventListener('click',e=>{if(c.done)return;const b=e.target.closest('.si');const x=A.rounds[r];
  if(b){const on=b.classList.toggle('on');b.setAttribute('aria-pressed',on);snd.pop();$('#cc',body).textContent='Coloured: '+$$('.si.on',body).length;return}
  if(e.target.closest('#chk')){const k=$$('.si.on',body).length,want=x.n*x.num/x.den;
   if(k===want){r++;const msg=`✅ Yes! ${x.num}/${x.den} of ${x.n} is ${want}.`;if(r<A.rounds.length){c.good(msg);setTimeout(show,1300)}else c.finish(A.win)}
   else c.miss(`You coloured ${k}. Make ${x.den} equal groups of ${x.n}. How many in one group? Then colour ${x.num} group${x.num>1?'s':''}.`,()=>{const g=x.n/x.den;$$('.si',body).forEach((s,i)=>s.dataset.g=Math.floor(i/g)%2);setFb(c.host,'hint',`💡 See the ${x.den} groups of ${g}? Colour ${x.num} of the groups.`)})}});
 show();
};

/* wall: build a fraction wall, then reason with it */
T.wall=function(body,A,c){
 let left=A.dens.length,fi=-1;
 const rows=[1,...A.dens];
 body.innerHTML=`<div class="wall">${rows.map(d=>`<div class="wrow" data-d="${d}"><div class="wl ${d===1?'ok':'dz'}" data-d="${d}" ${d===1?'':'role="button" tabindex="0"'}>${d===1?'1 whole':'?'}</div><div class="wt">${[...Array(d).keys()].map(()=>`<span class="tile" data-d="${d}">${d===1?'1':''}</span>`).join('')}</div></div>`).join('')}</div><div class="pool" id="chips">${shuffle(A.dens,6).map(d=>`<button class="item di chip" type="button" data-d="${d}">${F(1,d)}</button>`).join('')}</div><div class="task" id="wq"></div>`;
 DnD(body,{item:'.chip',zone:'.wl.dz',onDrop:(it,z)=>{if(c.done||fi>=0)return;const d=+it.dataset.d,zd=+z.dataset.d;
  if(d===zd){z.classList.remove('dz');z.classList.add('ok');z.innerHTML=F(1,d);it.remove();$$(`.tile[data-d="${d}"]`,body).forEach(t=>t.innerHTML=F(1,d));left--;
   if(left)c.good(`✅ Yes! That row has ${d} equal pieces, so each piece is 1/${d}.`);else{c.good('✅ Wall complete! Now use it to think.');fi=0;setTimeout(find,1200)}}
  else{bump(z);c.miss(`Count the pieces in that row. It has ${zd} equal pieces, so each one is not 1/${d}.`,()=>glow($(`.wl[data-d="${d}"]`,body)))}}});
 function find(){const q=A.finds[fi];$('#wq',body).innerHTML='🧱 '+fx(q.q);say(fx(q.q));$('#wq',body).scrollIntoView({block:'nearest'})}
 body.addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t||fi<0||c.done)return;const q=A.finds[fi],d=+t.dataset.d;
  if(d===1){c.miss('That is the whole bar, not a unit fraction piece. Pick a piece from the other rows.');return}
  if(d===q.d){$$(`.tile[data-d="${d}"]`,body).forEach(x=>{x.classList.add('hl')});fi++;if(fi<A.finds.length){c.good(`✅ Yes, 1/${d}!`);setTimeout(find,1100)}else c.finish(A.win)}
  else{bump(t);c.miss(`That piece is 1/${d}. Compare the lengths of the pieces in the wall.`,()=>$$(`.tile[data-d="${q.d}"]`,body).forEach(glow))}});
};

/* signs: compare fractions with > < = */
T.signs=function(body,A,c){
 const cyc=['?','>','<','='];
 body.innerHTML=`<div class="cmp">${A.pairs.map((p,i)=>`<div class="cp" data-i="${i}">${F(p[0],p[1])}<button class="sg" type="button" data-i="${i}" aria-label="choose sign">?</button>${F(p[3],p[4])}<div class="proof"></div></div>`).join('')}</div><div class="row"><button class="btn g" type="button" id="chk">Check ✔</button></div>`;
 const hintFor=p=>p[0]===1&&p[3]===1?'Both are unit fractions. The bigger denominator gives the SMALLER piece.':p[1]===p[4]?'The pieces are the same size, so compare the numerators.':p[2]==='='?`Is ${p[0]}/${p[1]} the same amount as ${p[3]}/${p[4]}? Picture them on the fraction wall.`:`Same number of pieces on top, but ${p[4]}ths are smaller than ${p[1]}ths.`;
 body.addEventListener('click',e=>{if(c.done)return;const s=e.target.closest('.sg');if(s){s.textContent=cyc[(cyc.indexOf(s.textContent)+1)%4];s.classList.remove('bad');snd.pop();return}
  if(e.target.closest('#chk')){const bad=$$('.sg',body).filter(s=>s.textContent!==A.pairs[+s.dataset.i][2]);
   if(!bad.length){$$('.cp',body).forEach((cp,i)=>{const p=A.pairs[i];$('.proof',cp).innerHTML=barSVG(p[1],set([...Array(p[0]).keys()]),{h:22})+barSVG(p[4],set([...Array(p[3]).keys()]),{h:22})});c.finish(A.win)}
   else{bad.forEach(s=>{s.classList.add('bad');bump(s)});const p=A.pairs[+bad[0].dataset.i];c.miss(`${bad.length} sign${bad.length>1?'s are':' is'} not right yet. Look at ${p[0]}/${p[1]} and ${p[3]}/${p[4]}: ${hintFor(p)}`)}}});
};

/* overlay: drag a fraction card onto the bar showing the same amount */
T.overlay=function(body,A,c){
 let left=A.cards.length;const tg=shuffle(A.targets.map((t,i)=>({t,i})),5);
 const tbar=(t,o)=>barSVG(t[1],set([...Array(t[0]).keys()]),Object.assign({h:44,fill:'#2fb872'},o||{}));
 body.innerHTML=`<div class="pool">${A.cards.map((k,i)=>`<button class="item di card2" type="button" data-i="${i}"><span class="cf">${F(k[0],k[1])}</span>${barSVG(k[1],set([...Array(k[0]).keys()]),{h:26,w:140})}</button>`).join('')}</div><div class="tgs">${tg.map(o=>`<div class="tg dz" data-i="${o.i}" role="button" tabindex="0"><div class="tl">${F(o.t[0],o.t[1])}</div>${tbar(o.t)}<div class="tc"></div></div>`).join('')}</div><div class="tip">Drag a card onto a green bar, or tap a card and then tap a bar.</div>`;
 DnD(body,{item:'.card2',zone:'.tg',onDrop:(it,z)=>{if(c.done||z.classList.contains('ok'))return;const k=A.cards[+it.dataset.i],t=A.targets[+z.dataset.i];
  if(k[0]*t[1]===t[0]*k[1]){z.classList.add('ok');z.innerHTML=`<div class="tl">${F(k[0],k[1])} = ${F(t[0],t[1])}</div>${tbar(t,{over:k[1],overN:k[0]})}<div class="tc">The yellow lines show ${fx(k[0]+'/'+k[1])}. Same length!</div>`;it.remove();left--;
   left?c.good(`✅ ${k[0]}/${k[1]} = ${t[0]}/${t[1]}. Same amount, more cuts!`):c.finish(A.win)}
  else{bump(z);c.miss(`${k[0]}/${k[1]} and ${t[0]}/${t[1]} are not the same amount. Compare how much of each bar is coloured.`)}}});
};

/* numline: drag the pin to a fraction */
T.numline=function(body,A,c){
 let r=0,tick=0;const X0=24,X1=316;
 const show=()=>{const x=A.rounds[r];tick=0;const tgt=x.show?F(x.show[0],x.show[1]):F(x.num,x.den);
  body.innerHTML=`<div class="task">Round ${r+1} of ${A.rounds.length}: put the pin at <span class="big">${tgt}</span></div>${x.note?`<div class="center muted">${x.note}</div>`:''}<div class="nlbox"><svg viewBox="0 0 340 120" class="nl" id="nl" role="slider" aria-label="number line" aria-valuemin="0" aria-valuemax="${x.den}" tabindex="0"></svg></div><div class="row"><button class="btn soft sm" type="button" id="lt" aria-label="Move left">◀</button><button class="btn g" type="button" id="chk">Check ✔</button><button class="btn soft sm" type="button" id="rt" aria-label="Move right">▶</button></div>`;draw();say('Put the pin at '+clean(tgt))};
 const draw=()=>{const x=A.rounds[r],sv=$('#nl',body);let s=`<rect x="0" y="0" width="340" height="120" fill="transparent"/><line x1="${X0}" y1="70" x2="${X1}" y2="70" stroke="#24406e" stroke-width="5" stroke-linecap="round"/>`;
  for(let i=0;i<=x.den;i++){const px=X0+(X1-X0)*i/x.den;s+=`<line x1="${px}" y1="58" x2="${px}" y2="82" stroke="#24406e" stroke-width="${i%x.den?3:5}"/>`}
  s+=`<text x="${X0}" y="108" text-anchor="middle" font-size="18" font-weight="800">0</text><text x="${X1}" y="108" text-anchor="middle" font-size="18" font-weight="800">1</text>`;
  const px=X0+(X1-X0)*tick/x.den;s+=`<g class="pin" style="transform:translateX(${px}px)"><path d="M0 52L-13 28A15 15 0 1 1 13 28Z" fill="#ef6b4a" stroke="#7a2412" stroke-width="2.5"/><circle cx="0" cy="20" r="5" fill="#fff"/></g>`;
  sv.innerHTML=s;sv.setAttribute('aria-valuenow',tick)};
 const toTick=cx=>{const x=A.rounds[r],b=$('#nl',body).getBoundingClientRect(),vx=(cx-b.left)/b.width*340;tick=Math.max(0,Math.min(x.den,Math.round((vx-X0)/(X1-X0)*x.den)));draw()};
 let dragging=false;
 body.addEventListener('pointerdown',e=>{if(!e.target.closest('#nl')||c.done)return;dragging=true;try{$('#nl',body).setPointerCapture(e.pointerId)}catch(_){}toTick(e.clientX)});
 body.addEventListener('pointermove',e=>{if(dragging)toTick(e.clientX)});
 const stop=()=>{if(dragging){dragging=false;snd.pop()}};body.addEventListener('pointerup',stop);body.addEventListener('pointercancel',stop);
 body.addEventListener('keydown',e=>{if(!e.target.closest('#nl'))return;const x=A.rounds[r];if(e.key==='ArrowRight'){tick=Math.min(x.den,tick+1);draw();e.preventDefault()}if(e.key==='ArrowLeft'){tick=Math.max(0,tick-1);draw();e.preventDefault()}});
 body.addEventListener('click',e=>{if(c.done)return;const x=A.rounds[r];
  if(e.target.closest('#lt')){tick=Math.max(0,tick-1);draw();return}if(e.target.closest('#rt')){tick=Math.min(x.den,tick+1);draw();return}
  if(e.target.closest('#chk')){if(tick===x.num){r++;const m=`✅ Yes! ${x.num} jumps of 1/${x.den} = ${x.num}/${x.den}${x.show?` = ${x.show[0]}/${x.show[1]}`:''}.`;if(r<A.rounds.length){c.good(m);setTimeout(show,1500)}else c.finish(A.win)}
   else c.miss(`The pin is at ${tick}/${x.den}. ${x.show?'Where is the exact middle of 0 and 1?':`Count ${x.num} jumps from 0. Each jump is 1/${x.den}.`}`,()=>{})}});
 show();
};

const skey=(n,i)=>n+'-'+i;
function home(){hush();window.scrollTo(0,0);$('#bar .t').textContent='Fraction Quest';
 const nxt=STATIONS.find(s=>!S.done[s.id]);
 const hello=allDone()?`Super work, ${NAME}! Every mission is complete. Open your gift!`:(nStars()?`Welcome back, ${NAME}! Ready for the next mission?`:`Hi ${NAME}! I am Zippy. Six missions on fractions are waiting. Think like a scientist!`);
 app().innerHTML=`<section class="card hero"><h1>🍕 Fraction Quest</h1><div class="sub">Fractions as parts of a whole · Class 4 Maths</div>${guideHTML(M.teach,'',hello+` <button class="say" type="button" data-say="${hello}" aria-label="Read aloud">🔊</button>`)}</section>
 <section class="map">${STATIONS.map(s=>{const st=s.acts.map((a,i)=>S.stars[skey(s.id,i)]?'⭐':'☆').join('');const lk=!open(s.id);return `<button class="stc ${lk?'lock':''} ${nxt&&nxt.id===s.id&&!lk?'next':''}" type="button" data-st="${s.id}" style="--c:${s.c};--bg:${s.bg}" ${lk?'aria-disabled="true"':''}><span class="ic">${lk?'🔒':s.icon}</span><span><span class="muted">Mission ${s.id}</span><br><span class="nm">${s.title}</span><br><span class="st" aria-label="stars">${st}${S.done[s.id]?' ✅':''}</span></span></button>`}).join('')}</section>

 <section class="card giftcard">${allDone()?`<button class="giftbtn wig" type="button" id="gift" aria-label="Open your gift">🎁</button><div><b>Your gift is ready. Tap it!</b></div>`:`<div class="giftbtn" aria-hidden="true" style="opacity:.5">🎁</div><div class="muted">Finish all 6 missions to unlock a surprise gift.</div>`}${allDone()&&S.gift?`<div class="row"><button class="btn o" type="button" id="seecert">🏆 My certificate</button></div>`:''}</section>
 <div class="foot"><button type="button" id="unl">Grown-ups: unlock all missions</button> · <button type="button" id="rst">Start again</button></div>`;
 app().onclick=e=>{const b=e.target.closest('.stc');if(b){const n=+b.dataset.st;if(!open(n)){say('Finish the mission before this one first!',true);bump(b);return}station(n,0);return}
  if(e.target.closest('#gift'))gift();if(e.target.closest('#seecert'))cert();if(e.target.closest('#unl')){S.all=true;save();home()}if(e.target.closest('#rst')&&confirm('Start the quest again? Stars and stickers will be cleared.')){const v=S.voice;S={stars:{},done:{},voice:v,gift:false};save();hud();home()}};

function station(n,step){hush();const s=STATIONS[n-1];window.scrollTo(0,0);$('#bar .t').textContent=`Mission ${n}: ${s.title}`;

 app().innerHTML=`<section class="card">${stepsHTML}${head}<div class="actt">${kind}: ${A.title}</div>${guideHTML(A.bonus?M.think:M.teach,A.bonus?'hint':'',fx(A.intro),true)}<div id="body"></div><div class="row" id="nav"><button class="btn soft" type="button" id="back">◀ Back</button><button class="btn g" type="button" id="next" ${S.stars[key]?'':'disabled'}>${last?'Finish mission 🏁':'Next activity ▶'}</button></div></section>`;
 const host=app().querySelector('.card');
