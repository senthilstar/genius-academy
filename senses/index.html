<style>@font-face{font-family:"NunitoE";src:url(assets/nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{--ink:#27324a;--sun:#ffd23f;--leaf:#2fb872;--leaf2:#1f8f57;--berry:#ff6a8d;--ocean:#2e86ff;--grape:#7d4fe8;--orange:#ff9b3d;--mint:#7fdcc1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"NunitoE","Nunito","Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#dff3ff 0,#fff6e0 50%,#ffe9f1 100%);background-attachment:fixed;color:var(--ink);font-size:20px;line-height:1.35;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

img{max-width:100%;height:auto}
h1,h2,h3{margin:.15em 0;line-height:1.15}
.wrap{max-width:820px;margin:0 auto;padding:10px 12px 60px}
.muted{color:#5d6a85;font-size:16px}
.center{text-align:center}
/* top bar */
#bar{position:sticky;top:0;z-index:30;background:#ffffffee;backdrop-filter:blur(6px);border-radius:0 0 22px 22px;padding:6px 10px;box-shadow:0 4px 14px #0002}
#bar .in{display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto}
#home{border:0;background:#e4f4ff;border-radius:16px;min-height:48px;padding:4px 12px;font-weight:900;font-size:18px}
#bar .t{flex:1;min-width:0;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff6d6;border:2px solid #ffe08a;border-radius:16px;padding:2px 10px;font-weight:900;font-size:18px;white-space:nowrap;min-height:40px;display:flex;align-items:center;gap:4px}
.pill.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
#voice{border:2px solid #cfe0f5;background:#fff;border-radius:16px;min-height:40px;min-width:48px;font-size:20px}
#voice[aria-pressed=false]{opacity:.55}
/* cards, buttons */
.card{background:#fff;border-radius:26px;padding:14px 16px;margin:12px 0;box-shadow:0 5px 18px #2a4a7a1f}
.btn{border:0;border-radius:22px;padding:12px 22px;min-height:58px;font-weight:900;font-size:22px;background:var(--ocean);color:#fff;box-shadow:0 5px 0 #1b5fb5;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b5fb5}
.btn.g{background:var(--leaf);box-shadow:0 5px 0 var(--leaf2)}
.btn.o{background:var(--orange);box-shadow:0 5px 0 #c96b12}
.btn.soft{background:#eef4fb;color:var(--ink);box-shadow:0 5px 0 #c9d6e6}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
/* mascot + speech bubble */
.guide{display:flex;align-items:center;gap:6px;margin:6px 0}
.guide img{width:42%;max-width:190px;flex:none;filter:drop-shadow(0 6px 6px #0002)}
.bub{position:relative;background:#fff;border:3px solid #bfe3d6;border-radius:22px;padding:10px 14px;font-weight:800;font-size:21px;flex:1;min-width:0}
.bub:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #bfe3d6;border-left:0}
.bub.oops{border-color:#ffc58f;background:#fff8ef}.bub.oops:before{border-right-color:#ffc58f}
.bub.hint{border-color:#c8b6ff;background:#f7f3ff}.bub.hint:before{border-right-color:#c8b6ff}
.bub.good{border-color:#9be3b8;background:#f0fff5}.bub.good:before{border-right-color:#9be3b8}
.guide.small img{width:30%;max-width:130px}
.guide.small .bub{font-size:19px}
.jump img{animation:jump .7s ease}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
/* map */
.hero h1{font-size:30px;text-align:center}
.hero .sub{text-align:center;font-weight:800;color:#5d6a85}
.map{display:grid;grid-template-columns:1fr;gap:12px}

.stc{display:flex;align-items:center;gap:12px;border:0;text-align:left;background:#fff;border-radius:24px;padding:12px 14px;box-shadow:0 5px 0 var(--c,#ccd),0 8px 18px #0001;min-height:96px;width:100%}

.stc.next{animation:glowp 1.6s infinite}

.stickers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.giftcard{text-align:center}
.giftbtn{font-size:84px;border:0;background:none;line-height:1}

.steps span.on{background:#ffe08a}.steps span.ok{background:#c8f2d8}
.sth{display:flex;align-items:center;gap:10px}
.sth .ic{font-size:40px}
.sth h2{font-size:26px}

.lesson .line .e{font-size:38px;flex:none;width:52px;text-align:center}
.lesson .line.rd{background:#fff3c4}
.actt{font-size:23px;font-weight:900;text-align:center;margin:6px 0}
.tip{text-align:center;color:#5d6a85;font-size:16px;margin-top:8px}

.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px;min-height:20px}
.di{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item{border:3px solid #d5e2f2;background:#fff;border-radius:20px;padding:6px 10px;min-width:96px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 4px 0 #d5e2f2;transition:transform .15s}

.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.bins.five{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.bin{border:4px dashed #b9cbe3;border-radius:22px;background:#f7fbff;min-height:140px;padding:8px;text-align:center;transition:background .15s,transform .15s}
.bin .bi{font-size:40px;line-height:1.1}
.bin h4{margin:2px 0;font-size:20px}
.bin .tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:30px;min-height:36px}
.over,.dz.over{background:#fff3c4!important;transform:scale(1.04);border-color:#ffb703!important}
.glow{animation:glw 1s 3}
@keyframes glw{0%,100%{box-shadow:0 0 0 0 #ffd23f}50%{box-shadow:0 0 0 9px #ffd23faa}}
.no{animation:shake .45s}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.mt .col{display:flex;flex-direction:column;gap:10px}

.facewrap svg{width:100%;height:100%;display:block}
.fz{position:absolute;transform:translate(-50%,-50%);border:4px dashed #8aa3c4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:#ffffff55}

.fz.earL .pe{transform:scaleX(-1);display:inline-block}

.room{position:relative;width:100%;max-width:560px;aspect-ratio:4/3;margin:0 auto;border-radius:22px;overflow:hidden;background:linear-gradient(#f9e6c8 0 64%,#c99a6b 64%);touch-action:none;user-select:none;-webkit-user-select:none}

.room .shelf{position:absolute;right:6%;top:30%;width:34%;height:5px;background:#8a5a33;border-radius:3px}

.dark.off{opacity:0}
.torchq{text-align:center;font-weight:900;font-size:23px;margin:8px 0}
/* sounds */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sbtn{position:relative;border:3px solid #d5e2f2;background:#fff;border-radius:22px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 4px 0 #d5e2f2;overflow:visible}
.sbtn .oi{font-size:46px}
.sbtn.heard{border-color:#5fd08f;background:#eafff1}

.sbtn.play .oi{animation:wob .5s 2}
@keyframes wob{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.15)}75%{transform:rotate(12deg) scale(1.15)}}
.ring{position:absolute;left:50%;top:40%;width:60px;height:60px;margin:-30px;border:4px solid #2e86ff;border-radius:50%;animation:ring 1s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.meter{height:16px;background:#e3ebf4;border-radius:10px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .4s}

.react{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px;min-height:84px}
.react .fe{font-size:64px;line-height:1;transition:transform .3s}
.react .fe.bump{animation:pop .6s}
/* riddle */
.bag{font-size:92px;border:0;background:none;line-height:1;display:block;margin:0 auto}
.bag.feel{animation:wig .9s 1}
.clue{text-align:center;font-size:25px;font-weight:900;min-height:40px;margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:460px;margin:8px auto 0}
.opt{border:3px solid #d5e2f2;background:#fff;border-radius:20px;min-height:100px;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #d5e2f2}
.opt .oi{font-size:46px}
.opt.right{border-color:#5fd08f;background:#eafff1}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:#1b2440aa;display:flex;align-items:center;justify-content:center;padding:14px}
.ov .box{background:#fff;border-radius:28px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px;text-align:center;animation:popin .4s}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ov .box img.mas{width:62%;max-width:260px}
.bigstk{font-size:90px;animation:spin 1s}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}to{transform:rotate(0) scale(1)}}
/* flying star */
.fly{position:fixed;z-index:80;font-size:44px;pointer-events:none;transition:transform .9s cubic-bezier(.5,-.3,.7,1),opacity .9s}
#cf{position:fixed;inset:0;pointer-events:none;z-index:90}
/* badge + certificate */
.badge{width:230px;height:230px;margin:6px auto;border-radius:50%;background:radial-gradient(circle,#fff7cf 0 55%,#ffd23f 56% 64%,#ff9b3d 65% 72%,#7d4fe8 73%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 22px #0003;animation:spin 1.1s}
.badge .t{font-weight:1000;font-size:21px;line-height:1.05;color:#4a2a9a}
.badge .e{font-size:28px;letter-spacing:2px}
.cert{border:8px double #ffb703;border-radius:26px;background:linear-gradient(#fffdf3,#fff4d6);text-align:center;padding:16px}
.cert .nm{font-size:44px;font-weight:1000;color:#7d4fe8;margin:4px 0}
.cert img{width:55%;max-width:240px}
.foot{text-align:center;margin-top:24px}
.foot button{border:0;background:none;color:#7a86a0;text-decoration:underline;font-size:15px;min-height:40px}
@media(min-width:700px){body{font-size:21px}.lesson .line{font-size:27px}.guide img{max-width:210px}}
@media print{#bar,.foot,.row,.noprint{display:none!important}body{background:#fff}.cert{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

const SFX={
 drum(a,t){[0,.45].forEach(o=>{const s=a.createOscillator(),g=a.createGain();s.frequency.setValueAtTime(160,t+o);s.frequency.exponentialRampToValueAtTime(45,t+o+.35);g.gain.setValueAtTime(.9,t+o);g.gain.exponentialRampToValueAtTime(.001,t+o+.4);s.connect(g);g.connect(a.destination);s.start(t+o);s.stop(t+o+.45)})},

 if(!CF.run){CF.run=true;(function loop(){const x=CF.x;x.clearRect(0,0,CF.c.width,CF.c.height);CF.p=CF.p.filter(p=>p.y<H+20&&p.l<180);CF.p.forEach(p=>{p.l++;p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-p.l/180);x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6);x.restore()});if(CF.p.length)requestAnimationFrame(loop);else{CF.run=false;x.clearRect(0,0,CF.c.width,CF.c.height)}})()}}

function DnD(root,o){

  drag={it,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,on:false,id:e.pointerId};try{it.setPointerCapture(e.pointerId)}catch(_){}});

  if(!drag.on&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){drag.on=true;clearSel();const g=drag.it.cloneNode(true);g.classList.add('ghost');g.removeAttribute('id');g.style.width=drag.it.offsetWidth+'px';document.body.appendChild(g);drag.g=g;drag.it.classList.add('drag');raf=requestAnimationFrame(edge)}
  if(drag.on){e.preventDefault();drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';const z=zoneAt(e.clientX,e.clientY);zones().forEach(q=>q.classList.toggle('over',q===z))}});

  zones().forEach(q=>q.classList.remove('over'));
  if(d.on){d.g.remove();d.it.classList.remove('drag');if(e.type==='pointerup'){const z=zoneAt(e.clientX,e.clientY);if(z)o.onDrop(d.it,z)}d.it.dataset.dragged='1';setTimeout(()=>delete d.it.dataset.dragged,80)}
  else if(e.type==='pointerup'){toggle(d.it)}};

  const z=e.target.closest(o.zone);if(!z||!root.contains(z)||!sel||(it&&z===it))return;const s=sel;clearSel();o.onDrop(s,z)});

}

  if(z.classList.contains('ok')){setFb(c.host,'hint','That spot is full. Find another dotted spot!');return}

  else{z.classList.remove('no');void z.offsetWidth;z.classList.add('no');c.miss(`Hmm, the ${it.innerText.trim().split('\n').pop().toLowerCase()} does not go there. Look at your own face!`,()=>{const g=$$('.fz',body).find(x=>!x.classList.contains('ok')&&(x.dataset.z.startsWith('ear')?'ear':x.dataset.z)===k);if(g){g.classList.remove('glow');void g.offsetWidth;g.classList.add('glow')}})}}});
};
/* torch in the dark room (simulation) */
T.torch=function(body,A,c){
 let r=0;const objs=shuffle(A.objs,3);
 body.innerHTML=`<div class="torchq" id="tq"></div><div class="room" id="room"><div class="win"></div><div class="shelf"></div><div class="rug"></div>${objs.map(o=>`<button class="ob" type="button" data-k="${o.k}" aria-label="${o.n}" style="left:${o.x}%;top:${o.y}%">${o.e}</button>`).join('')}<div class="dark" id="dk"></div></div><div class="row"><button class="btn o" type="button" id="lite" hidden>💡 Switch on the light!</button></div><div class="tip">Slide your finger (or mouse) to move the torch light. Tap the thing you find.</div>`;
 const room=$('#room',body),dk=$('#dk',body);let lx=.5,ly=.5,on=false;
 const mv=(x,y)=>{const b=room.getBoundingClientRect();lx=Math.min(1,Math.max(0,(x-b.left)/b.width));ly=Math.min(1,Math.max(0,(y-b.top)/b.height));dk.style.setProperty('--x',(lx*100)+'%');dk.style.setProperty('--y',(ly*100)+'%')};
 room.addEventListener('pointerdown',e=>mv(e.clientX,e.clientY));
 room.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)mv(e.clientX,e.clientY)});
 const q=()=>{const o=A.objs.find(x=>x.k===A.rounds[r]);$('#tq',body).textContent=`🔦 Find the ${o.n}!`;say(`Find the ${o.n}!`)};q();
 const lit=b=>{const R=room.getBoundingClientRect(),o=b.getBoundingClientRect();const dx=(o.left+o.width/2)-(R.left+lx*R.width),dy=(o.top+o.height/2)-(R.top+ly*R.height);return Math.hypot(dx,dy)<90};
 room.addEventListener('click',e=>{const b=e.target.closest('.ob');if(!b||c.done||on)return;if(e.detail===0){const o=b.getBoundingClientRect();mv(o.left+o.width/2,o.top+o.height/2)}
  if(r>=A.rounds.length)return;
  if(!lit(b)){c.miss('It is too dark there! Move the light first.');return}
  const want=A.rounds[r],o=A.objs.find(x=>x.k===b.dataset.k);
  if(b.dataset.k===want){b.classList.add('found');r++;if(r<A.rounds.length){c.good(`✅ I see the ${o.n}! Good looking!`,false);setTimeout(q,900)}
   else{$('#tq',body).textContent='🎉 You found them all! Now switch on the light.';c.good('✅ You found them all! Now switch on the light.');$('#lite',body).hidden=false}}
  else c.miss(`That is the ${o.n}. Keep looking for the ${A.objs.find(x=>x.k===want).n}!`,()=>{const g=$(`.ob[data-k="${want}"]`,body);const gb=g.getBoundingClientRect();mv(gb.left+gb.width/2,gb.top+gb.height/2)})});
 $('#lite',body).addEventListener('click',()=>{if(on)return;on=true;dk.classList.add('off');$('#lite',body).hidden=true;$('#tq',body).textContent='☀️ Light is on! Now we see everything!';c.finish(A.win)});
};
/* sound box (simulation) */
T.sounds=function(body,A,c){
 const heard=new Set();
 body.innerHTML=`<div class="sgrid">${A.items.map(x=>`<button class="sbtn" type="button" data-k="${x.k}"><span class="oi">${x.e}</span><span>${x.t}</span></button>`).join('')}</div><div class="meter"><i id="sm"></i></div><div class="tip">Turn the volume up. Tap all 6 things!</div>`;
 body.addEventListener('click',e=>{const b=e.target.closest('.sbtn');if(!b)return;const x=A.items.find(i=>i.k===b.dataset.k);sfx(x.k);
  b.classList.remove('play');void b.offsetWidth;b.classList.add('play');const rg=document.createElement('span');rg.className='ring';b.appendChild(rg);setTimeout(()=>rg.remove(),1000);
  b.classList.add('heard');heard.add(x.k);$('#sm',body).style.width=(heard.size/A.items.length*100)+'%';
  setFb(c.host,'good','👂 '+x.s,false);setTimeout(()=>say(x.s),1300);
  if(heard.size===A.items.length&&!c.done)setTimeout(()=>c.finish(A.win),1500)});
};
/* feely bag riddle (the one multiple-choice activity) */
T.riddle=function(body,A,c){
 let r=0,inBag=false;
 body.innerHTML=`<button class="bag" type="button" id="bag" aria-label="Mystery bag">🛍️</button><div class="clue" id="clue">Tap the bag!</div><div class="opts" id="opts" hidden>${A.opts.map(o=>`<button class="opt" type="button" data-k="${o.k}"><span class="oi">${o.e}</span><span>${o.t}</span></button>`).join('')}</div><div class="tip" id="rn">Mystery 1 of ${A.rounds.length}</div>`;
 const bag=$('#bag',body);
 bag.addEventListener('click',()=>{if(c.done)return;bag.classList.remove('feel');void bag.offsetWidth;bag.classList.add('feel');bag.textContent='✋🛍️';inBag=true;const cl=A.rounds[r].c;$('#clue',body).textContent='🤚 '+cl;$('#opts',body).hidden=false;say(cl+' What is it?')});
 $('#opts',body).addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||c.done||!inBag)return;
  if(b.dataset.k===A.rounds[r].k){const o=A.opts.find(x=>x.k===b.dataset.k);r++;inBag=false;bag.textContent='🛍️';$('#opts',body).hidden=true;
   if(r<A.rounds.length){$('#clue',body).textContent=`It was the ${o.t.toLowerCase()}! ${o.e} Tap the bag again!`;$('#rn',body).textContent=`Mystery ${r+1} of ${A.rounds.length}`;c.good(`✅ Yes! It was the ${o.t.toLowerCase()}! Tap the bag again.`)}
   else{$('#clue',body).textContent=`It was the ${o.t.toLowerCase()}! ${o.e}`;$('#rn',body).textContent='All mysteries solved!';c.finish(A.win)}}
  else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');const rk=A.rounds[r].k;c.miss('Hmm, would that feel like this? Listen to the clue again!',()=>{const g=$(`.opt[data-k="${rk}"]`,body);if(!g||!inBag)return;g.classList.remove('glow');void g.offsetWidth;g.classList.add('glow')})}});
};

/* ---------- views ---------- */
const app=()=>$('#app');
function home(){hush();window.scrollTo(0,0);$('#bar .t').textContent='My Five Senses';
 const nxt=STATIONS.find(s=>!S.done[s.id]);
 const hello=allDone()?`Wow, ${NAME}! You finished every station! Open your gift!`:(nStars()?`Welcome back, ${NAME}! Let us keep exploring!`:`Hi ${NAME}! I am Zippy. Let us explore your five senses!`);
 app().innerHTML=`<section class="card hero"><h1>🖐️ My Five Senses</h1><div class="sub">See · Hear · Smell · Taste · Touch</div>${guideHTML(M.teach,'',hello+` <button class="btn soft" type="button" data-say="${hello}" aria-label="Read aloud" style="min-height:44px;padding:4px 12px;font-size:18px">🔊</button>`)}</section>
 <section class="map">${STATIONS.map(s=>{const st=(S.stars[s.id+'a']?'⭐':'☆')+(S.stars[s.id+'b']?'⭐':'☆');const lk=!open(s.id);return `<button class="stc ${lk?'lock':''} ${nxt&&nxt.id===s.id&&!lk?'next':''}" type="button" data-st="${s.id}" style="--c:${s.c};--bg:${s.bg}" ${lk?'aria-disabled="true"':''}><span class="ic">${lk?'🔒':s.icon}</span><span><span class="muted">Station ${s.id}</span><br><span class="nm">${s.title}</span><br><span class="st" aria-label="stars">${st}${S.done[s.id]?' ✅':''}</span></span></button>`}).join('')}</section>
 <section class="card"><h3 class="center">📒 My sticker book</h3><div class="stickers">${STATIONS.map(s=>`<div class="stk ${S.done[s.id]?'got':''}" title="${s.sticker[1]}">${S.done[s.id]?s.sticker[0]:'?'}</div>`).join('')}</div></section>
 <section class="card giftcard">${allDone()?`<button class="giftbtn wig" type="button" id="gift" aria-label="Open your gift">🎁</button><div><b>Your gift is ready! Tap it!</b></div>`:`<div class="giftbtn" aria-hidden="true" style="opacity:.5">🎁</div><div class="muted">Finish all 6 stations to unlock a surprise gift!</div>`}</section>
 <div class="foot"><button type="button" id="unl">Grown-ups: unlock all stations</button> · <button type="button" id="rst">Start again</button></div>`;
 app().onclick=e=>{const b=e.target.closest('.stc');if(b){const n=+b.dataset.st;if(!open(n)){say('First finish the station before this one!',true);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}station(n,0);return}
  if(e.target.closest('#gift'))gift();if(e.target.closest('#unl')){S.all=true;save();home()}if(e.target.closest('#rst')&&confirm('Start the chapter again? Stars and stickers will be cleared.')){const v=S.voice;S={stars:{},done:{},voice:v,gift:false};save();hud();home()}};
 if(allDone()&&!S.gift)setTimeout(gift,400);
}
function station(n,step){hush();const s=STATIONS[n-1];window.scrollTo(0,0);$('#bar .t').textContent=`Station ${n}: ${s.title}`;
 const lab=['📖 Learn','🎮 Play 1','🎮 Play 2'];
 const stepsHTML=`<div class="steps">${lab.map((l,i)=>`<span class="${i===step?'on':''} ${(i===0&&step>0)||(i>0&&S.stars[n+(i===1?'a':'b')])?'ok':''}">${l}</span>`).join('')}</div>`;
 const head=`<div class="sth"><span class="ic">${s.icon}</span><h2>${s.title}</h2></div>`;
 if(step===0){
  app().innerHTML=`<section class="card lesson">${stepsHTML}${head}${guideHTML(M.teach,'',`Let us learn! Tap a line to hear it.`)}<div id="lines">${s.lesson.map(l=>`<button class="line" type="button" data-say="${l[1]}"><span class="e">${l[0]}</span><span>${l[1]}</span></button>`).join('')}</div><div class="row"><button class="btn soft" type="button" id="readall">🔊 Read to me</button><button class="btn g" type="button" id="go">Let us play! ▶</button></div></section>`;
  $('#readall').onclick=()=>readAll();$('#go').onclick=()=>{hush();station(n,1)};
  return}
 const A=s.acts[step-1],key=n+(step===1?'a':'b');
 const kind={face:'Puzzle',match:'Drag and match',torch:'Explore',sounds:'Listen',sort:'Sort it',riddle:'Guess'}[A.type];
 app().innerHTML=`<section class="card">${stepsHTML}${head}<div class="actt">${kind}: ${A.title}</div>${guideHTML(A.type==='riddle'?M.think:M.teach,A.type==='riddle'?'hint':'',A.intro,true)}<div id="body"></div><div class="row" id="nav"><button class="btn soft" type="button" id="back">◀ ${step===1?'Lesson':'Play 1'}</button><button class="btn g" type="button" id="next" ${S.stars[key]?'':'disabled'}>${step===1?'Next game ▶':'Finish station 🏁'}</button></div></section>`;
 const host=app().querySelector('.card');
 setTimeout(()=>say(A.intro),150);
 const c=ctx(host,A,()=>{const first=!S.stars[key];S.stars[key]=1;save();if(first)flyStar($('#fb .bub',host));else hud();$('#next').disabled=false;setTimeout(()=>$('#nav').scrollIntoView({behavior:'smooth',block:'nearest'}),700)});
 T[A.type]($('#body'),A,c);
 $('#back').onclick=()=>station(n,step-1);
 $('#next').onclick=()=>{if(step===1)station(n,2);else stationDone(n)};
}
function readAll(){hush();const L=$$('#lines .line');let i=0;const nx=()=>{L.forEach(x=>x.classList.remove('rd'));if(i>=L.length)return;const l=L[i++];l.classList.add('rd');speak(l.dataset.say,()=>setTimeout(nx,250))};nx();if(!('speechSynthesis' in window))L.forEach(x=>x.classList.add('rd'))}
function stationDone(n){const s=STATIONS[n-1];const first=!S.done[n];S.done[n]=1;save();hud(true);snd.win();confetti(160);
 const last=n===STATIONS.length;
 const t=first?`Station ${n} done! You earned the ${s.sticker[1]} sticker!`:`Station ${n} done again! Great practice!`;
 const m=modal(`${mimg(M.fox,'mas')}<div class="bigstk">${s.sticker[0]}</div><h2>${t}</h2><div class="muted">⭐ ${nStars()} of ${TOTAL} stars · ${Object.keys(S.done).length} of 6 stickers</div><div class="row">${last||allDone()?`<button class="btn o" type="button" data-close id="mgo">🎁 Open my gift!</button>`:`<button class="btn g" type="button" data-close id="mgo">Next station ▶</button>`}<button class="btn soft" type="button" data-close id="mmap">🗺️ Map</button></div>`);
 say(t);
 $('#mgo',m.el).onclick=()=>{if(allDone())home();else{const nx=STATIONS.find(x=>!S.done[x.id]);station(nx?nx.id:Math.min(6,n+1),0)}};
 $('#mmap',m.el).onclick=()=>home();
}
function gift(){if($('.ov'))return;snd.pop();say('A gift for you! Tap the box three times to open it!');let taps=0;
 const m=modal(`${mimg(M.fox,'mas')}<h2>🎁 A gift for ${NAME}!</h2><button class="giftbtn wig" type="button" id="gb" aria-label="Tap the gift">🎁</button><div class="muted" id="gt">Tap the gift 3 times!</div>`);
 $('#gb',m.el).onclick=()=>{taps++;snd.pop();const g=$('#gb',m.el);g.style.transform=`scale(${1+taps*.15})`;$('#gt',m.el).textContent=taps<3?`${3-taps} more!`:'';if(taps>=3){S.gift=true;save();m.close();badge()}};
}
function badge(){snd.win();confetti(260);setTimeout(()=>confetti(160),700);const t=`Hooray! ${NAME}, you are a Super Senses Explorer!`;say(t);
 const m=modal(`${mimg(M.party,'mas')}<div class="badge"><div class="e">👀👂</div><div class="t">SUPER<br>SENSES<br>EXPLORER</div><div class="e">👃👅✋</div></div><h2>${t}</h2><div class="row"><button class="btn o" type="button" data-close id="toc">🏆 See my certificate</button></div>`);
 $('#toc',m.el).onclick=()=>cert();
}
function cert(){hush();window.scrollTo(0,0);$('#bar .t').textContent='My certificate';const d=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
 app().innerHTML=`<section class="card cert" id="cert">${mimg(M.party)}<h2>🏆 Super Senses Explorer</h2><div>This certificate is proudly given to</div><div class="nm">${NAME}</div><div>for exploring <b>My Five Senses</b>:<br>seeing, hearing, smelling, tasting and touching,<br>and learning to keep them safe!</div><div style="font-size:34px;margin:8px 0">👀 👂 👃 👅 ✋</div><div><b>⭐ ${nStars()} stars</b> · <b>${Object.keys(S.done).length} stickers</b></div><div class="stickers" style="margin:8px 0">${STATIONS.map(s=>`<div class="stk ${S.done[s.id]?'got':''}">${S.done[s.id]?s.sticker[0]:'?'}</div>`).join('')}</div><div class="muted">Class 1 Science · ${d}</div><div class="muted">Signed: Zippy 👽, Professor Owl 🦉 and Detective Fox 🦊</div></section><div class="row"><button class="btn" type="button" id="pr">🖨️ Print</button><button class="btn soft" type="button" id="hm">🗺️ Map</button></div>`;
 $('#pr').onclick=()=>window.print();$('#hm').onclick=()=>home();
}
/* ---------- boot ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){say(b.getAttribute('data-say'),true);const l=b.closest('.line');if(l){$$('.line').forEach(x=>x.classList.remove('rd'));l.classList.add('rd')}}});
$('#home').onclick=()=>home();
$('#voice').onclick=()=>{S.voice=!S.voice;save();hud();if(!S.voice)hush();else say('Voice is on!')};
if(/[?&]all=1/.test(location.search)){S.all=true}
hud();home();
if('speechSynthesis' in window&&speechSynthesis.getVoices)try{speechSynthesis.getVoices()}catch(e){}
</script></body></html>
